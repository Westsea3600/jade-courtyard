  <body>
    <div id="app">
      <div id="scene" role="img" aria-label="可交互的中国古典建筑体素场景，含主殿、两座配殿、山门和两座钟鼓楼"></div>
      <div class="page-frame" aria-hidden="true"></div>
      <header class="header">
        <a class="brand" href="#" aria-label="山岚古境，返回全景">
          <span class="brand-seal" aria-hidden="true">山<br>岚</span>
          <span><strong>山岚古境</strong><small>JADE COURTYARD</small></span>
        </a>
        <nav class="top-nav" aria-label="主导航">
          <button class="nav-link active" id="overview-nav">全景漫游</button>
          <button class="nav-link" id="guide-toggle" aria-expanded="false" aria-controls="guide">建筑图鉴 <span>06</span></button>
          <span class="nav-divider"></span>
          <button class="icon-button" id="fullscreen" title="全屏观看" aria-label="全屏观看"><svg viewBox="0 0 24 24"><path d="M8 4H4v4m12-4h4v4M4 16v4h4m12-4v4h-4"/></svg></button>
        </nav>
      </header>

      <main class="intro">
        <div class="eyebrow"><span></span> A WORLD BUILT IN BLOCKS</div>
        <h1>一砖一瓦，<br>自成天地。</h1>
        <p class="intro-copy">把东方古建的千年意境，<br>藏进方寸之间。</p>
        <div class="intro-rule"></div>
        <p class="scene-edition">壹号造境 <span>/</span> 中式古典庭院</p>
        <button id="explore" class="explore-button">走近主殿 <svg viewBox="0 0 24 24"><path d="M4 12h15m-5-5 5 5-5 5"/></svg></button>
      </main>

      <aside class="guide" id="guide" aria-label="建筑图鉴" hidden>
        <div class="guide-heading"><span>建筑图鉴</span><button id="guide-close" class="icon-button" aria-label="关闭图鉴"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
        <p>沿中轴入境，寻一座院落的秩序。</p>
        <div id="landmark-list"></div>
        <button class="guide-overview" id="guide-overview">↗ 回到庭院全景</button>
      </aside>

      <div class="scene-note" id="scene-note" aria-live="polite">
        <span class="note-index" id="note-index">01 — 06</span>
        <span class="note-title" id="note-title">中轴有序 · 庭院深深</span>
        <span class="note-description" id="note-description">歇山飞檐 / 朱柱青瓦 / 对称院落</span>
      </div>

      <div class="right-mark" aria-hidden="true"><span>东方意境</span><i></i><small>VOXEL<br>LANDSCAPE</small></div>

      <footer class="footer">
        <div class="world-status"><span class="status-dot"></span><span>实时造境</span><span class="status-separator">/</span><span id="voxel-count">正在构筑…</span></div>
        <div class="toolbar" aria-label="场景控制">
          <button id="reset" class="tool-button" title="返回初始全景（R）" aria-label="返回初始全景"><svg viewBox="0 0 24 24"><path d="M3 10a9 9 0 1 1 1.5 7M3 4v6h6"/></svg></button>
          <button id="orbit" class="tool-button" title="自动环游（空格）" aria-label="自动环游" aria-pressed="false"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="5" transform="rotate(-25 12 12)"/><path d="m17 4 3 1-1 3"/><circle cx="12" cy="12" r="1"/></svg></button>
          <button id="top-view" class="tool-button" title="俯瞰院落" aria-label="俯瞰院落" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5Zm-9 9 9 5 9-5M3 16l9 5 9-5"/></svg></button>
          <span class="tool-divider"></span>
          <div class="light-options" aria-label="光照时段">
            <button data-light="morning" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M3 18h18M6 15a6 6 0 0 1 12 0M12 3v3M3 8l2 2m16-2-2 2"/></svg><span>晨曦</span></button>
            <button data-light="day" class="selected" aria-pressed="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg><span>暖阳</span></button>
            <button data-light="dusk" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M20 15.5A8.5 8.5 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5Z"/></svg><span>暮色</span></button>
          </div>
        </div>
        <div class="interaction-hint"><svg viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="6"/><path d="M12 6v4"/></svg><span>拖拽旋转 <b>·</b> 滚轮缩放</span></div>
      </footer>

      <div class="loading" id="loading"><span class="loading-seal">境</span><p>正在构筑山岚古境</p><small>BUILDING A QUIET WORLD</small></div>
      <div class="toast" id="toast" role="status"></div>
      <noscript><div class="fatal-error">请启用 JavaScript 以观看 3D 场景。</div></noscript>
    </div>
  </body>
</html>
